<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LakiLakid</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LakiLakid">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0d0d0d; --pind: #1a1a1a; --pind2: #232323; --joon: #333; --tekst: #f2f2f2; --tekst2: #9e9e9e;
    --oranz: #ff9900; --virsik: #f6b26b; --hea: #93c47d; --halb: #e06666; --sinine: #c9daf8;
    --kuld: #ffd700; --hobe: #c0c0c0; --pronks: #cd7f32;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--tekst);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 76px; }
  header { padding: calc(18px + env(safe-area-inset-top)) 16px 10px; background: linear-gradient(180deg, #1f1406 0%, var(--bg) 100%); }
  .bränd { display: flex; align-items: center; gap: 10px; }
  .bränd img { width: 52px; height: 52px; flex: none; }
  .keerleb { animation: keer 1.1s linear infinite; }
  @keyframes keer { to { transform: rotate(360deg); } }
  h1 { margin: 0; font: 400 30px/1 'Graduate', 'Rockwell', serif; letter-spacing: 1px;
    -webkit-text-stroke: 5px #1c3f94; paint-order: stroke fill; text-shadow: 0 2px 0 #0b1a40; }
  h1 .laki { color: #f7941d; } h1 .lakid { color: #8dc63f; }

  /* Laadimisekraan: logo pall põrkab */
  #splash { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; transition: opacity .35s; }
  #splash.peida { opacity: 0; pointer-events: none; }
  .porge { position: relative; width: 150px; height: 230px; }
  .porge img { position: absolute; left: 0; bottom: 30px; width: 150px; height: 150px;
    animation: porge .9s cubic-bezier(.5,0,.5,1) infinite alternate; transform-origin: 50% 100%; }
  .porge i { position: absolute; left: 25px; bottom: 14px; width: 100px; height: 16px; border-radius: 50%;
    background: radial-gradient(rgba(0,0,0,.65), transparent 70%); background-color: rgba(255,153,0,.12);
    animation: vari .9s cubic-bezier(.5,0,.5,1) infinite alternate; }
  @keyframes porge {
    0% { transform: translateY(-80px) rotate(-12deg); }
    85% { transform: translateY(0) scale(1, 1) rotate(10deg); }
    100% { transform: translateY(0) scale(1.08, .9) rotate(12deg); } }
  @keyframes vari { 0% { transform: scale(.55); opacity: .35; } 100% { transform: scale(1); opacity: 1; } }
  #splash h1 { font-size: 38px; }
  #splash .uuend { margin-top: -6px; }
  .uuend { color: var(--tekst2); font-size: 12px; margin-top: 2px; }

  .kpi { display: flex; gap: 8px; margin-top: 12px; }
  .kpi div { flex: 1; background: var(--pind); border: 1px solid var(--joon); border-radius: 10px; padding: 8px 6px; text-align: center; }
  .kpi b { display: block; font-size: 18px; color: var(--oranz); }
  .kpi small { color: var(--tekst2); font-size: 9.5px; white-space: normal; line-height: 1.25; display: block; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .jarg { flex: 2.6; min-width: 0; cursor: pointer; }
  .kpi .jarg:active { border-color: var(--oranz); }
  .kpi .jarg b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .jarg span { display: block; color: var(--tekst2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding: 0 16px; max-width: 720px; margin: 0 auto; }
  .vaade { display: none; } .vaade.aktiivne { display: block; }

  /* Edetabel */
  .tool { display: flex; gap: 6px; margin: 12px 0 10px; overflow-x: auto; scrollbar-width: none; }
  .tool::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--joon); background: var(--pind);
    color: var(--tekst2); font-size: 13px; cursor: pointer; user-select: none; }
  .chip.on { background: var(--oranz); color: #111; border-color: var(--oranz); font-weight: 600; }
  .otsi { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--joon); background: var(--pind);
    color: var(--tekst); font-size: 15px; outline: none; }
  .otsi:focus { border-color: var(--oranz); }
  .rida { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--pind); border-radius: 12px;
    margin-bottom: 6px; border: 1px solid transparent; cursor: pointer; }
  .rida:active { border-color: var(--oranz); }
  .rida.vaike { opacity: .55; }
  .koht { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
    background: var(--pind2); color: var(--tekst2); flex: none; }
  .k1 { background: var(--kuld); color: #111; } .k2 { background: var(--hobe); color: #111; } .k3 { background: var(--pronks); color: #111; }
  .nimi { flex: 1; min-width: 0; }
  .nimi b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nimi .mvp { color: var(--kuld); font-size: 11px; margin-left: 4px; }
  .tapid { display: flex; gap: 2px; margin-top: 4px; }
  .tapid i { width: 7px; height: 7px; border-radius: 50%; background: var(--halb); display: block; }
  .tapid i.W { background: var(--hea); }
  .num { text-align: right; flex: none; }
  .num b { display: block; font-size: 18px; color: var(--oranz); }
  .num small { color: var(--tekst2); font-size: 11px; white-space: nowrap; }
  .pais-rida { display: flex; justify-content: space-between; color: var(--tekst2); font-size: 11px; padding: 0 12px 6px;
    text-transform: uppercase; letter-spacing: .5px; }

  /* Profiil */
  .valik { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
  .valik select { flex: 1; padding: 10px; border-radius: 10px; background: var(--pind); color: var(--tekst);
    border: 1px solid var(--joon); font-size: 15px; }
  .nupp { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--joon); background: var(--pind); color: var(--tekst);
    font-size: 18px; cursor: pointer; }
  .hero { background: linear-gradient(135deg, #2a1a05, var(--pind)); border: 1px solid #3a2a10; border-radius: 16px; padding: 16px; }
  .hero h2 { margin: 0; font-size: 26px; }
  .hero .alam { color: var(--virsik); font-size: 13px; margin-top: 2px; }
  .ruudud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .ruut { background: rgba(0,0,0,.35); border-radius: 10px; padding: 8px; text-align: center; }
  .ruut b { display: block; font-size: 19px; }
  .ruut small { color: var(--tekst2); font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .ruut .lisa { color: var(--tekst2); font-size: 11px; display: block; }
  .kaart { background: var(--pind); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .kaart h3 { margin: 0 0 10px; font-size: 13px; color: var(--virsik); text-transform: uppercase; letter-spacing: .6px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--pind2); font-size: 14px; }
  .kv:first-of-type { border-top: 0; }
  .kv span:first-child { color: var(--tekst2); }
  .kv span:last-child { text-align: right; }
  .hea { color: var(--hea); } .halb { color: var(--halb); } .or { color: var(--oranz); }
  svg text { fill: var(--tekst2); font-size: 17px; }
  .tyhi { color: var(--tekst2); text-align: center; padding: 40px 0; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: rgba(20,20,20,.96);
    border-top: 1px solid var(--joon); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); }
  nav button { flex: 1; background: none; border: 0; color: var(--tekst2); padding: 10px 0 12px; font-size: 11px; cursor: pointer; }
  nav button span { display: block; font-size: 20px; margin-bottom: 2px; }
  nav button.on { color: var(--oranz); }
  /* Kuu */
  .kuu-hero { background: linear-gradient(135deg, #2a1a05, #1a1a1a 60%, #142a10); border: 1px solid #3a2a10; border-radius: 16px;
    padding: 16px; margin-top: 12px; }
  .kuu-hero h2 { margin: 0; font: 400 24px/1.1 'Graduate', serif; color: var(--kuld); }
  .auhinnad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .auh { background: var(--pind); border-radius: 14px; padding: 12px; border: 1px solid var(--joon); cursor: pointer; }
  .auh.lai { grid-column: 1 / -1; }
  .auh.esim { grid-column: 1 / -1; background: linear-gradient(135deg, #3a2a08, var(--pind)); border-color: #5a4210; }
  .auh .ik { font-size: 26px; }
  .auh .t { font-size: 11px; color: var(--virsik); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; margin-top: 4px; }
  .auh .v { font-size: 19px; font-weight: 800; margin-top: 4px; }
  .auh .v small { color: var(--oranz); font-weight: 600; font-size: 13px; margin-left: 4px; }
  .auh .k { color: var(--tekst2); font-size: 11px; margin-top: 2px; }
  .auh .jargm { color: var(--tekst2); font-size: 12px; margin-top: 6px; border-top: 1px solid var(--pind2); padding-top: 5px; }
  .ktab { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ktab th { color: var(--tekst2); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; text-align: right; padding: 4px 6px; font-weight: 600; }
  .ktab td { padding: 9px 4px; border-top: 1px solid var(--pind2); text-align: right; }
  .ktab td:nth-child(2), .ktab th:nth-child(2) { text-align: left; }
  .ktab td:first-child { color: var(--tekst2); width: 26px; }
  .ktab tr { cursor: pointer; }
  /* Ajalugu */
  .aasta { background: var(--pind); border: 1px solid var(--joon); border-radius: 12px; margin-bottom: 6px; }
  .aasta summary { display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; list-style: none; }
  .aasta summary::-webkit-details-marker { display: none; }
  .aasta .ay { font: 400 20px/1 'Graduate', 'Rockwell', serif; color: var(--oranz); width: 54px; flex: none; }
  .aasta .ayv { flex: 1; min-width: 0; }
  .aasta .ayv b { display: block; }
  .aasta .ayv b small { color: var(--oranz); font-weight: 600; font-size: 13px; margin-left: 4px; }
  .aasta .ayr { color: var(--tekst2); font-size: 12px; margin-top: 2px; }
  .aasta .ayn { color: var(--tekst2); transition: transform .2s; }
  .aasta[open] .ayn { transform: rotate(180deg); }
  .aasta .sis { padding: 0 12px 10px; }
  .htab { width: 100%; border-collapse: collapse; font-size: 13px; }
  .htab th { color: var(--tekst2); font-size: 12px; text-align: center; padding: 4px 6px; font-weight: 600; }
  .htab td { padding: 8px 6px; border-top: 1px solid var(--pind2); text-align: center; }
  .htab th:first-child, .htab td:first-child { text-align: left; }
  .htab tr[data-n] { cursor: pointer; }
  .htab .nul { color: #555; }
  /* Kalender */
  .kal-pv { margin: 16px 0 6px; font-size: 12px; color: var(--virsik); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
  .kal-pv small { color: var(--oranz); margin-left: 6px; font-size: 11px; }
  .kal-it { display: flex; align-items: center; gap: 12px; background: var(--pind); border: 1px solid var(--joon); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 6px; }
  .kal-aeg { width: 46px; flex: none; text-align: center; }
  .kal-aeg b { display: block; font-size: 16px; color: var(--oranz); }
  .kal-aeg small { color: var(--tekst2); font-size: 11px; }
  .kal-sis { flex: 1; min-width: 0; }
  .kal-sis > b { display: block; font-size: 15px; }
  .kal-alam { color: var(--tekst2); font-size: 12px; margin-top: 3px; }
  .kal-vorm { margin-top: 4px; font-size: 12px; color: var(--tekst); }
  .kal-vorm b { color: var(--oranz); }
  .kal-alam a { color: var(--tekst2); text-decoration: underline; text-decoration-color: #555; }
  .liiga { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 800; color: #111; margin-right: 6px; vertical-align: 1px; }
  .kal-it.trenn { background: transparent; border-style: dashed; }
  .kal-it.trenn .kal-aeg b { color: var(--tekst2); }
  .kal-it.ara { opacity: .5; }
  .kal-it.ara .kal-sis > b { text-decoration: line-through; }
  .kal-hoi { color: #ffd966; font-size: 12px; margin-top: 3px; }
  .kal-sk { text-align: right; flex: none; font-weight: 800; font-size: 18px; }
  .kal-sk small { display: block; font-size: 10px; letter-spacing: .5px; }
  .kal-link { display: block; padding: 10px 0; color: var(--virsik); border-top: 1px solid var(--pind2); text-decoration: none; font-size: 14px; }
  .kal-link:first-of-type { border-top: 0; }
  /* Admin */
  .adm-riba { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 0; color: var(--tekst2); font-size: 13px; }
  .link { color: var(--virsik); cursor: pointer; text-decoration: underline; font-size: 13px; }
  .suur { width: 100%; padding: 15px; border-radius: 12px; border: 0; background: var(--oranz); color: #111; font-size: 16px;
    font-weight: 700; cursor: pointer; margin-top: 12px; }
  .suur:disabled { opacity: .4; }
  .suur.hall { background: var(--pind2); color: var(--tekst); border: 1px solid var(--joon); }
  .suur.salvesta { background: var(--hea); font-size: 18px; padding: 18px; margin-top: 16px; }
  .nupurida { display: flex; gap: 8px; } .nupurida .suur { flex: 1; }
  .rida2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=date].otsi { color-scheme: dark; }
  .seg { display: flex; border: 1px solid var(--joon); border-radius: 10px; overflow: hidden; }
  .seg button { background: var(--pind2); color: var(--tekst2); border: 0; padding: 9px 16px; font-size: 15px; cursor: pointer; }
  .seg button.on { background: var(--oranz); color: #111; font-weight: 700; }
  .lyliti { color: var(--tekst2); font-size: 14px; display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .lyliti input { width: 20px; height: 20px; accent-color: var(--oranz); }
  .nimed { display: flex; flex-wrap: wrap; gap: 7px; }
  .nimi-chip { padding: 10px 13px; border-radius: 999px; border: 1px solid var(--joon); background: var(--pind2); color: var(--tekst);
    font-size: 15px; cursor: pointer; }
  .nimi-chip.on { background: var(--oranz); color: #111; border-color: var(--oranz); font-weight: 700; }
  .mang { background: var(--pind); border-radius: 14px; padding: 12px; margin-top: 12px; border: 2px solid transparent; }
  .mang.tehtud { border-color: #2e4a25; }
  .mang-pais { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  .mang-pais .link { margin-left: auto; }
  .tiimid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tiim { border-radius: 10px; padding: 6px 8px 8px; min-height: 60px; }
  .tiim.H { background: #f4f4f4; color: #111; } .tiim.T { background: #2f5fb3; color: #fff; }
  .tiim-pais { font-size: 10px; font-weight: 700; letter-spacing: 1px; opacity: .6; margin-bottom: 2px; }
  .tn { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 15px; font-weight: 600; }
  .tn span b { display: inline-block; width: 30px; height: 28px; line-height: 28px; text-align: center; border-radius: 8px;
    background: rgba(0,0,0,.15); margin-left: 4px; cursor: pointer; font-weight: 400; }
  .lisa-sel { width: 100%; margin-top: 6px; padding: 7px; border-radius: 8px; border: 1px dashed rgba(0,0,0,.3); background: transparent;
    color: inherit; font-size: 14px; }
  .tiim.T .lisa-sel { border-color: rgba(255,255,255,.4); } .lisa-sel option { color: #111; }
  .voit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .voit button { padding: 16px 6px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: 2px solid var(--joon);
    background: var(--pind2); color: var(--tekst2); }
  .voit .vH.on { background: #fff; color: #111; border-color: var(--kuld); }
  .voit .vT.on { background: #2f5fb3; color: #fff; border-color: var(--kuld); }
  .skoor { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--tekst2); font-size: 13px; }
  .skoor input { width: 64px; padding: 9px; border-radius: 9px; border: 1px solid var(--joon); background: var(--pind2); color: var(--tekst);
    font-size: 17px; text-align: center; }
  details.kaart summary { cursor: pointer; list-style: none; } details.kaart summary::-webkit-details-marker { display: none; }
  details.kaart[open] summary { margin-bottom: 8px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--joon); background: var(--pind2); color: var(--tekst);
    font-size: 18px; cursor: pointer; }
  .toast { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); background: #333; color: #fff;
    padding: 9px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="splash"><div class="porge"><i></i><img src="logo-pall.png" alt=""></div>
  <h1><span class="laki">LAKI</span><span class="lakid">LAKID</span></h1><div class="uuend" id="splashTekst">Laen statistikat…</div></div>
<header>
  <div class="bränd"><img id="logo" src="logo-pall.png" alt="LakiLakid"><h1><span class="laki">LAKI</span><span class="lakid">LAKID</span></h1></div>
  <div class="uuend" id="uuend"></div>
  <div class="kpi" id="kpi"></div>
</header>

<main>
  <section class="vaade aktiivne" id="v-edetabel">
    <div class="tool" id="sorteeri"></div>
    <input class="otsi" id="otsi" placeholder="🔍 Otsi mängijat" autocomplete="off">
    <div class="pais-rida" style="margin-top:12px"><span>Mängija · viimased 15</span><span id="sortSilt"></span></div>
    <div id="nimekiri"></div>
  </section>

  <section class="vaade" id="v-profiil">
    <div class="valik">
      <button class="nupp" id="eel">‹</button>
      <select id="mangija"></select>
      <button class="nupp" id="jar">›</button>
    </div>
    <div id="profiil"></div>
  </section>

  <section class="vaade" id="v-kuu"><div id="kuu"></div></section>

  <section class="vaade" id="v-kalender"><div id="kalender"></div></section>

  <section class="vaade" id="v-ajalugu"><div id="ajalugu"></div></section>

  <section class="vaade" id="v-admin"><div id="admin"></div></section>
</main>

<nav>
  <button class="on" data-v="edetabel"><span>🏆</span>Edetabel</button>
  <button data-v="profiil"><span>👤</span>Profiil</button>
  <button data-v="kuu"><span>🗓️</span>Kuu</button>
  <button data-v="kalender"><span>📅</span>Kalender</button>
  <button data-v="ajalugu"><span>🏛️</span>Ajalugu</button>
  <button data-v="admin" id="adminNupp" style="display:none"><span>⚙️</span>Admin</button>
</nav>
<div class="toast" id="toast"></div>

<script>
// Apps Scripti veebirakenduse aadress (Deploy → Web app → URL, lõpeb /exec)
const ANDMED_URL = 'https://script.google.com/macros/s/AKfycbz__M23-PdR3OpJ5wMm3T_XRS-gf0Luxk9Dk17Emr-Kl6e8B8EK7ciLq_6A_BUaDs0u/exec';
let D = null;

const $ = id => document.getElementById(id);
const koma = x => String(x);   // komakoht punktiga
const pct = (x, k) => x === null || x === undefined ? '–' : koma((x * 100).toFixed(k || 0)) + '%';
const pr = (w, g) => g ? `${koma((w / g * 100).toFixed(1))}% <small style="color:var(--tekst2)">(${w}/${g})</small>` : '–';
const mark = (x, k) => x === null || x === undefined ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '±') + koma(Math.abs(x).toFixed(k || 0));
const varv = (x, l) => x === null || x === undefined ? '' : x >= (l || 0.0001) ? 'hea' : x <= -(l || 0.0001) ? 'halb' : '';
const kp = v => v ? v.slice(8, 10) + '.' + v.slice(5, 7) + '.' + v.slice(0, 4) : '–';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1800); }

// Elo on "kindel" alates nii mitmendast mängust (sama piir mis Sheetsis: ELO.UUS_MANGE). Vähem mänge = hall ja nimekirja lõpus.
const eloMin = () => (D && D.eloMin) || 15;
const eloKindel = x => x.e !== null && (x.em === undefined || x.em >= eloMin());
// Aasta, mille statistikat näidatakse (viimase trenni aasta)
const aasta = () => (D && D.viimane ? D.viimane.slice(0, 4) : String(new Date().getFullYear()));

// ---------------- EDETABEL ----------------
const SORT = [
  { k: 'r', s: 'Ristid', f: x => x.r, n: x => x.r, lisa: x => `${x.t} trenni · ${pct(x.p, 1)}` },
  { k: 'p', s: 'Võidu %', f: x => x.g >= 20 ? x.p : -1, n: x => pct(x.p, 1), lisa: x => `${x.g} mängu` },
  { k: 'e', s: 'Elo', f: x => x.e === null ? -99999 : (eloKindel(x) ? x.e : x.e - 5000), n: x => x.e === null ? '–' : x.e,
    lisa: x => (eloKindel(x) || x.e === null || x.em === undefined) ? `vorm ${mark(x.v)}` : `${x.em} mängu` },
  { k: 'v', s: 'Vorm 🔥', f: x => x.v === null ? -999 : x.v, n: x => mark(x.v), lisa: x => `Elo ${x.e === null ? '–' : x.e}` },
  { k: 'pm', s: '+/-', f: x => x.skg >= D.minSk ? x.pm : -999, n: x => mark(x.pm, 1), lisa: x => `${x.skg} skooriga mängu` },
  { k: 't', s: 'Trenne', f: x => x.t, n: x => x.t, lisa: x => `${x.r} risti` }
];
let sort = SORT[0], otsing = '';

function init() {
  $('sorteeri').innerHTML = SORT.map((s, i) => `<div class="chip${i ? '' : ' on'}" data-i="${i}">${s.s}</div>`).join('');
  $('sorteeri').onclick = e => {
    const c = e.target.closest('.chip'); if (!c) return;
    sort = SORT[c.dataset.i];
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    joonistaTabel();
  };
  $('otsi').oninput = e => { otsing = e.target.value.trim().toLowerCase(); joonistaTabel(); };
  $('nimekiri').onclick = e => {
    const r = e.target.closest('.rida'); if (!r) return;
    if (D.profiil[r.dataset.n]) avaProfiil(r.dataset.n);
    else toast('Profiil on TOP 25 mängijal');
  };


  const nimed = Object.keys(D.profiil).sort((a, b) => D.profiil[a].k - D.profiil[b].k);
  $('mangija').innerHTML = nimed.map(n => `<option value="${esc(n)}">${D.profiil[n].k}. ${esc(n)}</option>`).join('');
  $('mangija').onchange = e => joonistaProfiil(e.target.value);
  const astu = d => { const i = nimed.indexOf($('mangija').value); const j = (i + d + nimed.length) % nimed.length; avaProfiil(nimed[j], true); };
  $('eel').onclick = () => astu(-1);
  $('jar').onclick = () => astu(1);
  let x0 = null;
  $('profiil').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  $('profiil').addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 70) astu(dx < 0 ? 1 : -1);
  }, { passive: true });

  joonistaTabel();
  joonistaProfiil(nimed[0]);
}

function joonistaTabel() {
  $('sortSilt').textContent = sort.s;
  const read = D.tabel.filter(x => !otsing || x.n.toLowerCase().includes(otsing))
    .filter(x => sort.k !== 'v' || !D.vormPiir || (x.vi && x.vi >= D.vormPiir))
    .filter(x => sort.k !== 'pm' || x.skg > 0)
    .slice().sort((a, b) => sort.f(b) - sort.f(a) || a.k - b.k);
  $('nimekiri').innerHTML = read.map((x, i) => {
    const koht = sort.k === 'r' ? x.k : i + 1;
    const kl = !otsing && koht <= 3 ? ' k' + koht : '';
    const tapid = x.l15.split('').map(c => `<i class="${c}"></i>`).join('');
    const vaike = (sort.k === 'p' && x.g < 20) || (sort.k === 'e' && !eloKindel(x)) || (sort.k === 'pm' && x.skg < D.minSk);
    return `<div class="rida${vaike ? ' vaike' : ''}" data-n="${esc(x.n)}">
      <div class="koht${kl}">${koht}</div>
      <div class="nimi"><b>${esc(x.n)}${x.mvp ? `<span class="mvp">${'★'.repeat(Math.min(x.mvp, 5))}</span>` : ''}</b>
        <div class="tapid">${tapid}</div></div>
      <div class="num"><b class="${sort.k === 'v' ? varv(x.v) : sort.k === 'pm' ? varv(x.pm, 0.5) : ''}">${sort.n(x)}</b><small>${sort.lisa(x)}</small></div>
    </div>`;
  }).join('') || '<div class="tyhi">Ei leitud</div>';
  const marge = {
    p: 'Võidu % järjestuses min 20 mängu',
    e: `Elo on kindel alates ${eloMin()} mängust – vähem mänginud on hallid ja nimekirja lõpus (reiting alles loksub paika)`,
    v: 'Vormis on ainult viimase 5 trenni käijad',
    pm: `+/- = keskmine punktivahe skooriga mängudes (järjestuses min ${D.minSk} mängu)`
  }[sort.k];
  if (marge) $('nimekiri').insertAdjacentHTML('beforeend', `<div class="uuend" style="text-align:center;margin:8px 0">${marge}</div>`);
}

// ---------------- PROFIIL ----------------
function vaade(v) {
  if (v === 'admin') joonistaAdmin();
  if (v === 'kuu') joonistaKuu();
  if (v === 'kalender') joonistaKalender();
  if (v === 'ajalugu') joonistaAjalugu();
  document.querySelectorAll('.vaade').forEach(x => x.classList.toggle('aktiivne', x.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  window.scrollTo(0, 0);
}
function avaProfiil(n, jaa) { $('mangija').value = n; joonistaProfiil(n); if (!jaa) vaade('profiil'); else window.scrollTo(0, 0); }

function kv(silt, vaartus) { return `<div class="kv"><span>${silt}</span><span>${vaartus}</span></div>`; }
function kaart(pealkiri, sisu) { return `<div class="kaart"><h3>${pealkiri}</h3>${sisu}</div>`; }

function eloGraafik(p) {
  const pts = p.elo;
  if (!pts || pts.length < 3) return '<div class="uuend">Elo graafikuks on veel vähe mänge.</div>';
  const W = 640, H = 220, P = { l: 52, r: 12, t: 14, b: 28 };
  const ys = pts.map(x => x[1]);
  let min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
  min = Math.floor((Math.min(min, 1000) - 10) / 25) * 25; max = Math.ceil((Math.max(max, 1000) + 10) / 25) * 25;
  const x = i => P.l + i / (pts.length - 1) * (W - P.l - P.r);
  const y = v => P.t + (max - v) / (max - min) * (H - P.t - P.b);
  const tee = pts.map((q, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(q[1]).toFixed(1)}`).join('');
  const ala = `${tee}L${x(pts.length - 1).toFixed(1)},${H - P.b}L${P.l},${H - P.b}Z`;
  const tipp = ys.indexOf(Math.max.apply(null, ys));
  const viim = pts.length - 1;
  const jooned = [min, (min + max) / 2, max].map(v =>
    `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2a2a"/><text x="${P.l - 5}" y="${y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`).join('');
  const algus = `<line x1="${P.l}" x2="${W - P.r}" y1="${y(1000)}" y2="${y(1000)}" stroke="#555" stroke-dasharray="3 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Elo ajas">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9900" stop-opacity=".35"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></linearGradient></defs>
    ${jooned}${algus}
    <path d="${ala}" fill="url(#g)"/><path d="${tee}" fill="none" stroke="#ff9900" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(tipp)}" cy="${y(ys[tipp])}" r="3.5" fill="#ffd700"/>
    <circle cx="${x(viim)}" cy="${y(ys[viim])}" r="4.5" fill="#ff9900" stroke="#0d0d0d" stroke-width="2"/>
    <text x="${P.l}" y="${H - 6}">${kp(pts[1][0])}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${kp(pts[viim][0])}</text>
  </svg><div class="uuend">● tipp ${p.et} · katkendjoon = algus 1000</div>`;
}

function joonistaProfiil(n) {
  const p = D.profiil[n];
  if (!p) return;
  const tapid = p.l15.split('').map(c => `<i class="${c}" style="width:10px;height:10px"></i>`).join('');
  const sr = p.sr && p.sr !== '-' ? `<span class="${p.sr[0] === 'W' ? 'hea' : 'halb'}">${p.sr}</span>` : '–';
  let h = `<div class="hero">
    <h2>${esc(p.n)} ${p.mvp ? `<span style="color:var(--kuld);font-size:16px">${'★'.repeat(p.mvp)}</span>` : ''}</h2>
    <div class="alam">#${p.k} edetabelis · ${p.r} risti${p.b ? ` (sh boonus ${p.b})` : ''}</div>
    <div class="ruudud">
      <div class="ruut"><b class="or">${pct(p.p, 1)}</b><small>Võidu %</small><span class="lisa">${p.w}/${p.g} mängu</span></div>
      <div class="ruut"><b>${p.e === null ? '–' : p.e}</b><small>Elo</small><span class="lisa">tipp ${p.et === null ? '–' : p.et}</span></div>
      <div class="ruut"><b class="${varv(p.ev)}">${mark(p.ev)}</b><small>Vorm</small><span class="lisa">viim. 5 trenni</span></div>
      <div class="ruut"><b>${p.t}</b><small>Trenne</small><span class="lisa">osalus ${pct(p.os)} · järjest ${p.kj}</span></div>
      <div class="ruut"><b>${sr}</b><small>Seeria</small><span class="lisa">pikim W${p.mxW} / L${p.mxL}</span></div>
      <div class="ruut"><b class="${p.sk ? varv(p.sk.pm, 0.5) : ''}">${p.sk ? mark(p.sk.pm, 1) : '–'}</b><small>+/- mängus</small><span class="lisa">${p.sk ? p.sk.g + ' skooriga' : 'skoore pole'}</span></div>
    </div>
    <div class="tapid" style="margin-top:12px;gap:4px">${tapid}</div>
    <div class="uuend">viimased 15 mängu · ${p.w}/${p.g} võitu kokku</div>
  </div>`;

  h += kaart('📈 Elo ajas', eloGraafik(p));

  const nd = p.nd.length ? `${p.nd[0].d} ${Math.round(p.nd[0].w / p.nd[0].g * 100)}%` + (p.nd.length > 1 ? ` · halvim ${p.nd[p.nd.length - 1].d} ${Math.round(p.nd[p.nd.length - 1].w / p.nd[p.nd.length - 1].g * 100)}%` : '') : '–';
  h += kaart('🎯 Mõju ja päevad',
    kv('Clutch (päeva 3. mäng)', p.m3.g ? `${pr(p.m3.w, p.m3.g)} · <span class="${varv(p.m3.i, 0.02)}">${mark(p.m3.i === null ? null : p.m3.i * 100)}%</span>` : '–') +
    kv('Hele särk', pr(p.he.w, p.he.g)) + kv('Tume särk', pr(p.tu.w, p.tu.g)) +
    kv('Parim päev', nd) +
    kv('Underdogina (Elo šanss &lt; 45%)', p.ud ? pr(p.ud.w, p.ud.g) : '–') +
    kv('Päevad: 100% / plussis / viik', `${p.pt.d100} / ${p.pt.dPlus} / ${p.pt.dEq}`) +
    kv('Päevad: miinuses / 0%', `${p.pt.dMinus} / ${p.pt.d0}`) +
    kv('Kõikumatus (päevi ≥ 1 võiduga)', pct(p.ko)) +
    kv('Viimati käinud', `${kp(p.vi)}${p.vah ? ` · ${p.vah} trenni vahele` : ''}`));

  h += kaart('🤝 Kaaslased ja sünergia',
    kv('Enim koos', p.kaas.length ? p.kaas.map(x => `${esc(x.n)} (${x.g})`).join(' · ') : '–') +
    kv('Parim DUO', p.duo ? `${esc(p.duo.n)} · <span class="${varv(p.duo.m, 0.02)}">${mark(p.duo.m * 100)}%</span> (${p.duo.w}/${p.duo.g})` : '–') +
    kv('Parim TRIO', p.trio ? `${esc(p.trio.n)} · <span class="${varv(p.trio.m, 0.02)}">${mark(p.trio.m * 100)}%</span> (${p.trio.w}/${p.trio.g})` : '–') +
    '<div class="uuend" style="margin-top:6px">Keemia = mitu % rohkem võite kui Elo järgi oodata.</div>');

  const loend = (l, f) => l.length ? l.map(f).join('<br>') : '–';
  h += kaart('⚔️ Rivaalid',
    kv('Suurimad rivaalid', loend(p.riv, x => `${esc(x.n)} <span class="halb">${Math.round(x.l / x.g * 100)}% kaotusi</span> (${x.l}/${x.g})`)) +
    kv('Rivaal üle ootuse', p.rivOE ? `${esc(p.rivOE.n)} <span class="halb">+${Math.round(p.rivOE.m * 100)}%</span>` : '–') +
    kv('Lemmikvastased', loend(p.lem, x => `${esc(x.n)} <span class="hea">${Math.round(x.w / x.g * 100)}% võite</span> (${x.w}/${x.g})`)) +
    kv('Lemmik üle ootuse', p.lemOE ? `${esc(p.lemOE.n)} <span class="hea">+${Math.round(p.lemOE.m * 100)}%</span>` : '–'));

  if (p.sk) h += kaart('🏁 Lõppskoorid',
    kv('Skooriga mänge', `${p.sk.g} (võite ${p.sk.w})`) +
    kv('+/- mängu kohta', `<span class="${varv(p.sk.pm, 1)}">${mark(p.sk.pm, 1)}</span>`) +
    kv('Napid mängud (W-L)', p.sk.nG ? `${p.sk.nW}-${p.sk.nG - p.sk.nW}` : '–') +
    kv('🔥 Andis leili (suur võit)', p.sk.la) + kv('🧖 Sai sauna (suur kaotus)', p.sk.sa));

  $('profiil').innerHTML = h;
}

  const K = D && D.kuu;
  if (!K) { $('kuu').innerHTML = '<div class="tyhi">Kuu andmeid veel pole.</div>'; return; }
  let h = `<div class="kuu-hero"><h2>${K.jooksev ? '🏆 MVP-JAHT' : '🏆 KUU MVP'}</h2>

      <div class="v">${esc(a.l[0].n)}<small>${esc(a.l[0].s)}</small></div><div class="k">${esc(a.k)}</div>
      ${a.l.length > 1 ? `<div class="jargm">${a.l.slice(1).map((x, j) => `${j + 2}. ${esc(x.n)} <span style="color:var(--oranz)">${esc(x.s)}</span>`).join(' · ')}</div>` : ''}
    </div>`).join('') + '</div>';
  h += kaart(`📋 ${kuuNimi(K.kuu)} – ristid`, `<table class="ktab"><tr><th>#</th><th>Mängija</th><th>Ristid</th><th>Trenne</th><th>%</th><th>+/-</th><th>Elo</th></tr>
    ${K.tabel.map((x, i) => `<tr data-n="${esc(x.n)}"><td>${i + 1}</td><td><b>${esc(x.n)}</b></td><td class="or"><b>${x.r}</b></td><td>${x.t}</td>

  $('kuu').innerHTML = h;
}

/** Lisab igale reale koha (võrdsed tulemused jagavad kohta). */
function ajKohad(read) {
  let eel = null, koht = 0;
  return read.map((x, i) => {
    const v = x[1] !== null ? 's' + x[1] : (x[2] !== undefined ? 'g' + x[2] : 'n' + i);
    if (v !== eel) koht = i + 1;
    eel = v;
    return { n: x[0], t: x[0], s: x[1], g: x[2], k: koht };
  });
}

function ajVaartus(x) { return x.s !== null ? String(x.s) : x.g !== undefined ? '−' + Math.abs(x.g) + ' risti' : '–'; }

function joonistaAjalugu() {
  const el = $('ajalugu');
  const aastad = Object.keys(AJ).map(Number).sort((a, b) => b - a).map(y => ({ y: y, r: ajKohad(AJ[y]) }));

  // Mängijate kokkuvõte
  const m = {};
  aastad.forEach(A => A.r.forEach(x => {
    const s = m[x.n] || (m[x.n] = { n: x.n, g: 0, s: 0, b: 0, t5: 0 });
    if (x.k === 1) s.g++; else if (x.k === 2) s.s++; else if (x.k === 3) s.b++;
    if (x.k <= 5) s.t5++;
  }));
  const P = Object.keys(m).map(n => m[n]);
  const hof = P.filter(x => x.g + x.s + x.b > 0)
    .sort((a, b) => b.g - a.g || b.s - a.s || b.b - a.b || b.t5 - a.t5 || a.n.localeCompare(b.n, 'et'));
  const num = (v, v1) => v ? (v1 ? `<b class="or">${v}</b>` : v) : '<span class="nul">·</span>';

  // Rekordid
  const maksimum = f => { const v = Math.max.apply(null, P.map(f)); return { v: v, l: P.filter(x => f(x) === v).map(x => esc(x.n)).join(', ') }; };
  const tiit = maksimum(x => x.g), ped = maksimum(x => x.g + x.s + x.b), top5 = maksimum(x => x.t5);
  let parim = null;
  aastad.forEach(A => A.r.forEach(x => { if (x.s !== null && (!parim || x.s > parim.s)) parim = { s: x.s, n: x.n, y: A.y }; }));
  const vahed = aastad.map(A => {
    const a = A.r[0], b = A.r[1];
    if (!a || !b) return null;
    const v = a.s !== null && b.s !== null ? a.s - b.s : (b.g !== undefined ? Math.abs(b.g) : null);
    return v === null ? null : { y: A.y, v: v, a: a.n, b: b.n };
  }).filter(Boolean);
  const minVahe = vahed.length ? Math.min.apply(null, vahed.map(x => x.v)) : null;
  const tihedad = vahed.filter(x => x.v === minVahe);

  // Jooksev aasta
  const jooksev = D ? D.tabel.slice().sort((a, b) => a.k - b.k).slice(0, 3) : [];

  let h = '';
  if (jooksev.length) {
    h += `<div class="kuu-hero"><h2>🏆 ${aasta()} · käimas</h2>
      <div style="margin-top:8px">${jooksev.map((x, i) => `<div class="kv"><span>${['🥇', '🥈', '🥉'][i]} ${esc(x.n)}</span><span class="or"><b>${x.r}</b> risti</span></div>`).join('')}</div>
      <div class="uuend" style="margin-top:6px">Iga aasta lõpus liigub tulemus siia arhiivi ja ristikeste jaht algab uuest.</div></div>`;
  }

  h += kaart('🏛️ Au hall', `<table class="htab"><tr><th>Mängija</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Top 5</th></tr>
    ${hof.map(x => `<tr data-n="${esc(x.n)}"><td><b>${esc(x.n)}</b></td><td>${num(x.g, true)}</td><td>${num(x.s)}</td><td>${num(x.b)}</td><td>${num(x.t5)}</td></tr>`).join('')}</table>
    <div class="uuend" style="margin-top:6px">Kohad aasta ristikeste edetabelis. Nimele puudutades avaneb profiil (kui mängija on selle aasta TOP 25-s).</div>`);

  h += kaart('📌 Rekordid',
    kv('Enim tiitleid', `${tiit.l} · ${tiit.v}`) +
    kv('Enim pjedestaale (TOP 3)', `${ped.l} · ${ped.v}`) +
    kv('Enim TOP 5 kohti', `${top5.l} · ${top5.v}`) +
    (parim ? kv('Parim hooaeg', `${esc(parim.n)} · ${parim.s} risti (${parim.y})`) : '') +
    (minVahe !== null ? kv('Tihedaim võitlus', tihedad.map(x => `${x.y} ${esc(x.a)}–${esc(x.b)}`).join(' · ') + ` · vahe ${minVahe} ${minVahe === 1 ? 'rist' : 'risti'}`) : ''));

  h += '<div class="pais-rida" style="margin-top:16px"><span>Aastate tulemused</span><span>puuduta → TOP</span></div>';
  h += aastad.map(A => {
    const koht = k => A.r.filter(x => x.k === k);
    const voit = koht(1).map(x => `${esc(x.n)}${x.s !== null ? `<small>${x.s}</small>` : ''}`).join(', ');
    const teised = [[2, '🥈'], [3, '🥉']].map(z => koht(z[0]).length ? `${z[1]} ${koht(z[0]).map(x => esc(x.n)).join(', ')}` : '').filter(Boolean).join(' · ');
    return `<details class="aasta"><summary><span class="ay">${A.y}</span>
      <div class="ayv"><b>🥇 ${voit}</b><div class="ayr">${teised}</div></div><span class="ayn">▾</span></summary>
      <div class="sis">${A.r.map(x => kv(`${x.k}. ${esc(x.t)}`, ajVaartus(x))).join('')}</div></details>`;
  }).join('');
  h += '<div class="uuend" style="text-align:center;margin:12px 0">Varasemate aastate andmed on käsitsi kogutud: 2009–2011 puuduvad osade kohtade punktid.</div>';
  el.innerHTML = h;
}

// ---------------- KALENDER (mängud + trennid) ----------------
// Mängud tulevad Sheetsi lehelt "Kalender" (…/exec?kal=1), trennid arvutatakse reeglitest:
// riigipühal trenni pole, mängupäeval jääb trenn ära (v.a. mäng enne 13:00 → hoiatus), lisaks käsitsi "Trennid ära".
const KAL_KEY = 'korvpall-kalender';
const NPN = ['Pühapäev', 'Esmaspäev', 'Teisipäev', 'Kolmapäev', 'Neljapäev', 'Reede', 'Laupäev'];
const NPL = ['P', 'E', 'T', 'K', 'N', 'R', 'L'];
const LIIGAD = { RHL: '#ff9900', Rahvaliiga: '#6fa8ff' };
const RHL_URL = 'https://liiga.bcforwards.ee/';
const BASKET_URL = 'https://www.basket.ee/et/pohja-regiooni-rahvaliiga/221/ajakava-ja-tulemused/?action=schedule';
let K = null, kalTab = 'tul';

const kIso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const kDate = s => new Date(Number(s.slice(0, 4)), Number(s.slice(5, 7)) - 1, Number(s.slice(8, 10)));
const kAeg = (d, t) => { const x = kDate(d); const o = (t || '00:00').split(':'); x.setHours(Number(o[0]), Number(o[1]), 0, 0); return x; };
const kLyhike = s => s.slice(8, 10) + '.' + s.slice(5, 7);

function lihavoted(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    kuu = Math.floor((h + l - 7 * m + 114) / 31), paev = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, kuu - 1, paev);
}
const pyhaMall = {};
function pyhad(y) {
  if (pyhaMall[y]) return pyhaMall[y];
  const p = {};
  [['01-01', 'Uusaasta'], ['02-24', 'Iseseisvuspäev'], ['05-01', 'Kevadpüha'], ['06-23', 'Võidupüha'], ['06-24', 'Jaanipäev'],
    ['08-20', 'Taasiseseisvumispäev'], ['12-24', 'Jõululaupäev'], ['12-25', 'Esimene jõulupüha'], ['12-26', 'Teine jõulupüha']]
    .forEach(x => { p[y + '-' + x[0]] = x[1]; });
  const lisa = (n, nimi) => { const d = lihavoted(y); d.setDate(d.getDate() + n); p[kIso(d)] = nimi; };
  lisa(-2, 'Suur reede'); lisa(0, 'Ülestõusmispühade 1. püha'); lisa(49, 'Nelipühade 1. püha');
  return (pyhaMall[y] = p);
}

/** Mängud + järgmiste `paevi` päeva trennid ühes järjestatud nimekirjas. */
function kalSundmused(paevi) {
  const mangud = (K && K.mangud) || [];
  const T = K && K.trennid;
  const ev = mangud.map(m => ({ liik: 'm', d: m.d, t: m.t || '', m: m, algus: kAeg(m.d, m.t) }));
  if (T && T.reeglid) {
    const ara = {}; (T.ara || []).forEach(x => { ara[x.d] = x.p || 'trenn ära'; });
    const nyyd = new Date();
    for (let i = 0; i < paevi; i++) {
      const dt = new Date(nyyd.getFullYear(), nyyd.getMonth(), nyyd.getDate() + i);
      const iso = kIso(dt), pv = dt.getDay() || 7;
      T.reeglid.filter(r => r.pv === pv).forEach(r => {
        const e = { liik: 't', d: iso, t: r.t, koht: r.k, algus: kAeg(iso, r.t), markus: T.markus || '' };
        const pyha = pyhad(dt.getFullYear())[iso];
        const samal = mangud.filter(m => m.d === iso && m.t).sort((a, b) => a.t.localeCompare(b.t));
        if (iso in ara) e.ara = ara[iso];
        else if (pyha) e.ara = pyha;
        else if (samal.length) {
          if (samal[0].t < (T.varaPiir || '13:00')) e.hoiatus = 'Mäng kell ' + samal[0].t + ' – trenn võib ära jääda';
          else e.ara = 'mäng ' + samal[0].t;
        }
        ev.push(e);
      });
    }
  }
  return ev.sort((a, b) => a.algus - b.algus || (a.liik === 'm' ? -1 : 1));
}

const kalOnTulemas = (e, n) => e.liik === 'm' ? !e.m.s && e.algus.getTime() + 3 * 3600e3 >= n : e.algus.getTime() + 2 * 3600e3 >= n;
function kalTulevased() { const n = Date.now(); return kalSundmused(42).filter(e => kalOnTulemas(e, n)); }
function kalJargmine() { const n = Date.now(); return kalSundmused(42).find(e => !e.ara && !(e.liik === 'm' && e.m.s) && e.algus.getTime() >= n) || null; }

function kalPaev(iso) {
  const dt = kDate(iso), tana = new Date(), homme = new Date(tana.getFullYear(), tana.getMonth(), tana.getDate() + 1);
  const silt = iso === kIso(tana) ? 'Täna' : iso === kIso(homme) ? 'Homme' : '';
  return `${NPN[dt.getDay()]} ${kLyhike(iso)}${silt ? `<small>${silt}</small>` : ''}`;
}
function kalLuhikePaev(iso) {
  const tana = new Date(), homme = new Date(tana.getFullYear(), tana.getMonth(), tana.getDate() + 1);
  return iso === kIso(tana) ? 'Täna' : iso === kIso(homme) ? 'Homme' : NPL[kDate(iso).getDay()] + ' ' + kLyhike(iso);
}

function kalMangHtml(m, tulemus) {
  const meie = (K && K.meie) || 'LakiLakid';
  const kodu = m.h === meie, vastane = kodu ? m.g : m.h;
  const vari = LIIGAD[m.l] || '#999';
  let sk = '';
  if (m.s) {
    const my = kodu ? m.s[0] : m.s[1], op = kodu ? m.s[1] : m.s[0], v = my > op;
    sk = `<div class="kal-sk ${v ? 'hea' : 'halb'}">${my}–${op}<small>${v ? 'VÕIT' : 'KAOTUS'}</small></div>`;
  } else if (tulemus) sk = '<div class="kal-sk" style="color:var(--tekst2);font-size:12px;font-weight:400">tulemus puudub</div>';
  const koht = m.v ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.v)}" target="_blank" rel="noopener">${esc(m.v)}</a>` : '';
  const aeg = tulemus ? `<b>${kLyhike(m.d)}</b>${m.t ? `<small>${m.t}</small>` : ''}` : `<b>${m.t || '?'}</b>`;
  const vormHtml = tulemus ? '' : `<div class="kal-vorm">${kodu ? '⚪ Kodumäng – võta kindlasti <b>valge</b> vorm' : '⚫ Võõrsil – võta kindlasti <b>tume</b> vorm'}</div>`;
  return `<div class="kal-it"><div class="kal-aeg">${aeg}</div>
    <div class="kal-sis"><b>LakiLakid vs ${esc(vastane)}</b>
      <div class="kal-alam"><span class="liiga" style="background:${vari}">${esc(m.l || '?')}</span>${kodu ? 'Kodus' : 'Võõrsil'}${koht ? ' · ' + koht : ''}</div>${vormHtml}</div>${sk}</div>`;
}

function kalTrennHtml(e) {
  if (e.ara) return `<div class="kal-it trenn ara"><div class="kal-aeg"><b>${e.t}</b></div>
    <div class="kal-sis"><b>🏀 Trenn</b><div class="kal-alam">Trenni pole · ${esc(e.ara)}</div></div></div>`;
  const alam = [e.koht, e.markus].filter(Boolean).join(' · ');
  return `<div class="kal-it trenn"><div class="kal-aeg"><b>${e.t}</b></div>
    <div class="kal-sis"><b>🏀 Trenn</b><div class="kal-alam">${esc(alam)}</div>${e.hoiatus ? `<div class="kal-hoi">⚠️ ${esc(e.hoiatus)}</div>` : ''}</div></div>`;
}

function kalTulevasedHtml() {
  const ev = kalTulevased();
  if (!ev.length) return '<div class="tyhi">Tulevasi mänge pole.<br><small>Kinnitamata mängud ilmuvad siia, kui neil on kellaaeg.</small></div>';
  let h = '', viimane = '';
  ev.forEach(e => {
    if (e.d !== viimane) { viimane = e.d; h += `<div class="kal-pv">${kalPaev(e.d)}</div>`; }
    h += e.liik === 'm' ? kalMangHtml(e.m, false) : kalTrennHtml(e);
  });
  return h;
}

function kalTulemusedHtml() {
  const n = Date.now();
  const mangud = ((K && K.mangud) || []).filter(m => m.s || kAeg(m.d, m.t).getTime() + 3 * 3600e3 < n)
    .sort((a, b) => kAeg(b.d, b.t) - kAeg(a.d, a.t));
  if (!mangud.length) return '<div class="tyhi">Mänge pole veel mängitud.</div>';
  return mangud.map(m => kalMangHtml(m, true)).join('');
}

/** Avalehe KPI-d: Trenne (aastaga), Mänge trennis + järgmine mäng/trenn. */
function joonistaKpi() {
  if (!D) return;
  let h = [[`Trenne ${aasta()}`, D.trenne], ['Mänge trennis', D.mange]].map(x => `<div><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');

// ---------------- ADMIN (trenni sisestus) ----------------
const A_KEY = 'lakid-admin', T_KEY = 'lakid-trenn';
const PAARID = { 3: [[0, 1], [0, 2], [1, 2]], 4: [[0, 1], [2, 3], [0, 2], [1, 3], [0, 3], [1, 2]] };
let admin = null, T = null;
try { admin = JSON.parse(localStorage.getItem(A_KEY)); } catch (e) { }
try { T = JSON.parse(localStorage.getItem(T_KEY)); } catch (e) { }

const tana = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function uusTrenn() { return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), kp: tana(), tiime: 2, elo: false, kohal: [], lisa: {}, mangud: [], tiimid: null, faas: 'kohal', paranda: false }; }
if (!T) T = uusTrenn();
function salvestaMustand() { try { localStorage.setItem(T_KEY, JSON.stringify(T)); } catch (e) { } }

async function post(keha) {
  const r = await fetch(ANDMED_URL, { method: 'POST', body: JSON.stringify(keha), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
  return r.json();
}

// --- loos (sama loogika mis Trenn lehel)
const sega = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const pv = (a, b) => a < b ? a + '|' + b : b + '|' + a;
function paarid(mangud) {
  const k = {};
  mangud.forEach(m => [m.hele, m.tume].forEach(t => { for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) k[pv(t[i], t[j])] = (k[pv(t[i], t[j])] || 0) + 1; }));
  return k;
}
function kordus(t, k) { let s = 0; for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) { const x = k[pv(t[i], t[j])] || 0; s += x * x; } return s; }
function eloKaart() { const r = {}; (D ? D.tabel : []).forEach(x => { if (x.e !== null) r[x.n] = x.e; }); return r; }
const tElo = (t, r) => t.length ? t.reduce((s, n) => s + (r[n] === undefined ? 1000 : r[n]), 0) / t.length : 1000;
function segaKaheks(nimed, eel, elo) {
  const k = paarid(eel), suur = Math.ceil(nimed.length / 2);
  let parim = null, pS = Infinity;
  for (let i = 0; i < 3000; i++) {
    const s = sega(nimed), a = s.slice(0, suur), b = s.slice(suur);
    let x = kordus(a, k) + kordus(b, k);
    if (elo) x += Math.abs(tElo(a, elo) - tElo(b, elo)) / 10;
    if (x < pS) { pS = x; parim = [a, b]; }
  }
  return Math.random() < 0.5 ? parim : [parim[1], parim[0]];
}
function jagaTiimideks(nimed, arv, eel, elo) {
  const k = paarid(eel);
  let parim = null, pS = Infinity;
  for (let i = 0; i < 3000; i++) {
    const s = sega(nimed), t = Array.from({ length: arv }, () => []);
    s.forEach((n, j) => t[j % arv].push(n));
    let x = t.reduce((a, y) => a + kordus(y, k), 0);
    if (elo) { const r = t.map(y => tElo(y, elo)); x += (Math.max(...r) - Math.min(...r)) / 10; }
    if (x < pS) { pS = x; parim = t; }
  }
  return sega(parim);
}
const uusMang = (hele, tume, silt) => ({ hele: hele.slice(), tume: tume.slice(), v: null, skH: '', skT: '', silt: silt || '' });
function lisaRing() {
  const t = jagaTiimideks(T.kohal, T.tiime, T.mangud, T.elo ? eloKaart() : null);
  T.tiimid = t;
  PAARID[T.tiime].forEach(p => T.mangud.push(uusMang(t[p[0]], t[p[1]], `T${p[0] + 1} – T${p[1] + 1}`)));
}
function lisaKaheMang() { const t = segaKaheks(T.kohal, T.mangud, T.elo ? eloKaart() : null); T.mangud.push(uusMang(t[0], t[1])); }

function loosi() {
  if (T.kohal.length < 4) return toast('Vali vähemalt 4 mängijat');
  if (T.tiime > 2 && T.kohal.length < T.tiime * 2) return toast(`${T.tiime} tiimi jaoks on vaja vähemalt ${T.tiime * 2} mängijat`);
  if (T.mangud.some(m => m.v) && !confirm('Mängudel on juba võitjad. Loosin kõik uuesti?')) return;
  T.mangud = []; T.tiimid = null;
  if (T.tiime <= 2) { for (let i = 0; i < 3; i++) lisaKaheMang(); } else lisaRing();
  T.faas = 'mangud'; T.paranda = false;
  salvestaMustand(); joonistaAdmin(); window.scrollTo(0, 0);
}
function loosiPooleli() {
  const ootel = T.mangud.map((m, i) => m.v ? -1 : i).filter(i => i >= 0);
  if (!ootel.length) return toast('Kõigil mängudel on võitja');
  const tehtud = T.mangud.filter(m => m.v);
  ootel.forEach(i => { const t = segaKaheks(T.kohal, tehtud.concat(T.mangud.filter((m, j) => j < i && !m.v)), T.elo ? eloKaart() : null); T.mangud[i] = uusMang(t[0], t[1]); });
  salvestaMustand(); joonistaAdmin(); toast(`${ootel.length} mängu loositud uuesti`);
}

// --- ristid elavalt
function ristid() {
  const r = {};
  T.kohal.forEach(n => { r[n] = T.lisa[n] || 0; });
  T.mangud.forEach(m => { if (m.v) (m.v === 'H' ? m.hele : m.tume).forEach(n => { r[n] = (r[n] || 0) + 1; }); });
  return r;
}

// --- vaade
function joonistaAdmin() {
  const el = $('admin');
  if (!admin) {
    el.innerHTML = `<div class="kaart" style="margin-top:16px"><h3>🔐 Admin</h3>
      <div class="uuend" style="margin-bottom:10px">Trenni sisestamiseks logi sisse oma PIN-iga.</div>
      <input class="otsi" id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
      <button class="suur" id="pinNupp" style="margin-top:10px">Logi sisse</button></div>`;
    $('pinNupp').onclick = async () => {
      const pin = $('pin').value.trim(); if (!pin) return;
      $('pinNupp').disabled = true; $('pinNupp').textContent = 'Kontrollin…';
      try {
        const v = await post({ tegevus: 'pin', pin: pin });
        if (!v.ok) throw new Error(v.viga);
        admin = { pin: pin, nimi: v.nimi }; localStorage.setItem(A_KEY, JSON.stringify(admin));
        joonistaAdmin();
      } catch (e) { toast(e.message || 'Ühendus ebaõnnestus'); $('pinNupp').disabled = false; $('pinNupp').textContent = 'Logi sisse'; }
    };
    return;
  }
  let h = `<div class="adm-riba"><span>👋 ${esc(admin.nimi)}</span><span class="link" data-a="valja">logi välja</span></div>`;
  if (T.faas === 'valmis') {
    h += `<div class="kaart" style="text-align:center;padding:28px 14px"><div style="font-size:44px">✅</div><h3 style="text-align:center">Trenn salvestatud</h3>
      <div class="uuend">${esc(T.teade || '')}</div><button class="suur" data-a="uus" style="margin-top:16px">Alusta uut trenni</button></div>`;
    el.innerHTML = h; return;
  }
  if (T.faas === 'kohal') h += kohalVaade(); else h += mangudVaade();
  el.innerHTML = h;
}

function kohalVaade() {
  const valitud = new Set(T.kohal);
  const nimed = (D ? D.tabel.slice() : []).sort((a, b) => (b.vi || '').localeCompare(a.vi || '') || b.t - a.t).map(x => x.n);
  T.kohal.forEach(n => { if (nimed.indexOf(n) < 0) nimed.unshift(n); });
  let h = `<div class="kaart"><h3>📅 Trenn</h3>
    <div class="rida2"><input type="date" class="otsi" id="kp" value="${T.kp}" style="flex:1"></div>
    <div class="rida2" style="margin-top:10px"><span class="uuend" style="margin:0">Tiime</span>
      <div class="seg">${[2, 3, 4].map(n => `<button data-a="tiime" data-n="${n}" class="${T.tiime === n ? 'on' : ''}">${n}</button>`).join('')}</div>
      <label class="lyliti"><input type="checkbox" id="elo" ${T.elo ? 'checked' : ''}> Elo tasakaal</label></div></div>
    <div class="kaart"><h3>👥 Kohal <span class="or">${T.kohal.length}</span></h3>
    <div class="nimed">${nimed.map(n => `<button class="nimi-chip${valitud.has(n) ? ' on' : ''}" data-a="kohal" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <div class="rida2" style="margin-top:10px"><input class="otsi" id="uusNimi" placeholder="+ uus nimi" style="flex:1"><button class="nupp" data-a="lisaNimi">+</button></div></div>`;
  h += T.mangud.length
    ? `<div class="nupurida"><button class="suur hall" data-a="mangudele">⬅ Tagasi mängude juurde</button><button class="suur" data-a="loosi">🎲 Loosi uuesti</button></div>`
    : `<button class="suur" data-a="loosi" ${T.kohal.length < 4 ? 'disabled' : ''}>🎲 Loosi tiimid</button>`;
  return h;
}

function mangudVaade() {
  const rist = ristid();
  let h = `<div class="nupurida"><button class="suur hall" data-a="kohalFaas">👥 Kohal (${T.kohal.length})</button>
    <button class="suur ${T.paranda ? '' : 'hall'}" data-a="paranda">✏️ ${T.paranda ? 'Valmis' : 'Paranda'}</button></div>`;
  T.mangud.forEach((m, i) => {
    const tiim = (pool, nimed) => `<div class="tiim ${pool}"><div class="tiim-pais">${pool === 'H' ? 'HELE' : 'TUME'}</div>
      ${nimed.map(n => `<div class="tn">${esc(n)}${T.paranda ? `<span><b data-a="vaheta" data-i="${i}" data-p="${pool}" data-n="${esc(n)}">⇄</b><b data-a="eemalda" data-i="${i}" data-p="${pool}" data-n="${esc(n)}">✕</b></span>` : ''}</div>`).join('')}
      ${T.paranda ? `<select class="lisa-sel" data-a="lisaMangu" data-i="${i}" data-p="${pool}"><option value="">+ lisa</option>${T.kohal.filter(n => m.hele.indexOf(n) < 0 && m.tume.indexOf(n) < 0).map(n => `<option>${esc(n)}</option>`).join('')}</select>` : ''}</div>`;
    h += `<div class="mang${m.v ? ' tehtud' : ''}">
      <div class="mang-pais"><b>Mäng ${i + 1}</b>${m.silt ? `<span class="uuend" style="margin:0">${esc(m.silt)}</span>` : ''}
        ${T.paranda ? `<span class="link" data-a="kustutaMang" data-i="${i}">🗑️ kustuta</span>` : ''}</div>
      <div class="tiimid">${tiim('H', m.hele)}${tiim('T', m.tume)}</div>
      <div class="voit"><button class="vH${m.v === 'H' ? ' on' : ''}" data-a="voit" data-i="${i}" data-v="H">${m.v === 'H' ? '🏆 ' : ''}HELE võitis</button>
        <button class="vT${m.v === 'T' ? ' on' : ''}" data-a="voit" data-i="${i}" data-v="T">${m.v === 'T' ? '🏆 ' : ''}TUME võitis</button></div>
      <div class="skoor"><span>Skoor</span><input inputmode="numeric" maxlength="3" placeholder="H" value="${m.skH}" data-a="sk" data-i="${i}" data-p="skH">
        <i>–</i><input inputmode="numeric" maxlength="3" placeholder="T" value="${m.skT}" data-a="sk" data-i="${i}" data-p="skT"></div>
    </div>`;
  });
  h += `<div class="nupurida">${T.tiime <= 2 ? '<button class="suur hall" data-a="lisaMang">+ Mäng</button>' : '<button class="suur hall" data-a="uusRing">🔁 Uus ring</button>'}
    ${T.paranda ? `<button class="suur hall" data-a="tyhiMang">+ Tühi mäng</button>` : ''}</div>`;
  if (T.paranda && T.tiime <= 2) h += `<button class="suur hall" data-a="loosiPooleli" style="margin-top:8px">🎲 Loosi võitjata mängud uuesti</button>`;
  h += `<details class="kaart" ${Object.keys(T.lisa).some(n => T.lisa[n]) ? 'open' : ''}><summary><h3 style="display:inline">⭐ Boonus (Lisa X) ja ristid</h3></summary>
    ${T.kohal.slice().sort((a, b) => (rist[b] || 0) - (rist[a] || 0)).map(n => `<div class="kv"><span>${esc(n)} <small class="or">${'x'.repeat(rist[n] || 0)}</small></span>
      <span class="stepper"><button data-a="lisaX" data-n="${esc(n)}" data-d="-1">−</button><b>${T.lisa[n] || 0}</b><button data-a="lisaX" data-n="${esc(n)}" data-d="1">+</button></span></div>`).join('')}</details>`;
  h += `<button class="suur salvesta" data-a="salvesta">💾 Salvesta trenn</button>
    <div class="uuend" style="text-align:center;margin:8px 0 20px">Mustand on telefonis alles ka siis, kui leht sulgub.</div>`;
  return h;
}

function kontrolli() {
  const vead = [];
  const mangud = T.mangud.filter(m => m.hele.length || m.tume.length);
  if (!mangud.length) vead.push('Ühtegi mängu pole');
  mangud.forEach((m, i) => {
    if (!m.v) vead.push(`Mäng ${i + 1}: võitja märkimata`);
    const h = m.skH === '' ? null : Number(m.skH), t = m.skT === '' ? null : Number(m.skT);
    if ((h === null) !== (t === null)) vead.push(`Mäng ${i + 1}: skoor pooleli`);
    else if (h !== null && (h === t || (h > t) !== (m.v === 'H'))) vead.push(`Mäng ${i + 1}: skoor ei klapi võitjaga`);
  });
  return vead;
}

async function salvesta() {
  const vead = kontrolli();
  if (vead.length) return toast(vead[0]);
  const mangud = T.mangud.filter(m => m.hele.length || m.tume.length);
  if (!confirm(`Salvestan trenni ${kp(T.kp)}: ${T.kohal.length} mängijat, ${mangud.length} mängu?`)) return;
  const tiimNr = {};
  (T.tiimid || []).forEach((t, i) => t.forEach(n => { tiimNr[n] = i + 1; }));
  const keha = { tegevus: 'salvesta', pin: admin.pin, id: T.id, trenn: {
    kp: T.kp, tiime: T.tiime,
    mangijad: T.kohal.map(n => ({ nimi: n, lisa: T.lisa[n] || 0, tiim: tiimNr[n] || '' })),
    mangud: mangud.map(m => ({ hele: m.hele, tume: m.tume, voitja: m.v, silt: m.silt,
      skoor: m.skH !== '' && m.skT !== '' ? { h: Number(m.skH), t: Number(m.skT) } : null }))
  } };
  const nupp = document.querySelector('[data-a="salvesta"]');
  nupp.disabled = true; nupp.textContent = 'Salvestan…';
  try {
    const v = await post(keha);
    if (!v.ok) {
      if (v.viga === 'Vale PIN') { admin = null; localStorage.removeItem(A_KEY); }
      throw new Error(v.viga);
    }
    T = { faas: 'valmis', teade: v.teade }; localStorage.removeItem(T_KEY);
    joonistaAdmin(); window.scrollTo(0, 0);
    setTimeout(() => fetch(ANDMED_URL, { cache: 'no-store' }).then(r => r.json()).then(u => { if (u) { localStorage.setItem('korvpall', JSON.stringify(u)); naita(u, false); } }).catch(() => { }), 75000);
  } catch (e) {
    toast(e.message || 'Ei saanud saata – proovi uuesti');
    nupp.disabled = false; nupp.textContent = '💾 Salvesta trenn';
  }
}

function adminKlikk(e) {
  const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  const a = b.dataset.a, i = Number(b.dataset.i), n = b.dataset.n;
  const m = T.mangud && T.mangud[i];
  switch (a) {
    case 'valja': if (confirm('Logi välja?')) { admin = null; localStorage.removeItem(A_KEY); if (location.hash !== '#admin') $('adminNupp').style.display = 'none'; } break;
    case 'uus': T = uusTrenn(); break;
    case 'tiime': T.tiime = Number(b.dataset.n); break;
    case 'kohal': { const j = T.kohal.indexOf(n); if (j >= 0) T.kohal.splice(j, 1); else T.kohal.push(n); break; }
    case 'lisaNimi': {
      const u = $('uusNimi').value.trim().replace(/\s+/g, ' ');
      if (!u) return; if (T.kohal.indexOf(u) < 0) T.kohal.push(u); break;
    }
    case 'loosi': return loosi();
    case 'loosiPooleli': return loosiPooleli();
    case 'mangudele': T.faas = 'mangud'; break;
    case 'kohalFaas': T.faas = 'kohal'; break;
    case 'paranda': T.paranda = !T.paranda; break;
    case 'voit': m.v = m.v === b.dataset.v ? null : b.dataset.v; break;
    case 'vaheta': { const [s, d] = b.dataset.p === 'H' ? [m.hele, m.tume] : [m.tume, m.hele]; s.splice(s.indexOf(n), 1); d.push(n); break; }
    case 'eemalda': { const s = b.dataset.p === 'H' ? m.hele : m.tume; s.splice(s.indexOf(n), 1); break; }
    case 'kustutaMang': if (!confirm(`Kustutan mängu ${i + 1}?`)) return; T.mangud.splice(i, 1); break;
    case 'lisaMang': if (T.kohal.length < 4) return toast('Liiga vähe mängijaid'); lisaKaheMang(); break;
    case 'uusRing': lisaRing(); break;
    case 'tyhiMang': T.mangud.push(uusMang([], [])); break;
    case 'lisaX': T.lisa[n] = Math.max(0, (T.lisa[n] || 0) + Number(b.dataset.d)); break;
    case 'salvesta': return salvesta();
    default: return;
  }
  salvestaMustand(); joonistaAdmin();
}
function adminMuutus(e) {
  const t = e.target;
  if (t.id === 'kp') T.kp = t.value;
  else if (t.id === 'elo') T.elo = t.checked;
  else if (t.dataset.a === 'sk') { T.mangud[Number(t.dataset.i)][t.dataset.p] = t.value.replace(/\D/g, ''); }
  else if (t.dataset.a === 'lisaMangu' && t.value) {
    const m = T.mangud[Number(t.dataset.i)]; (t.dataset.p === 'H' ? m.hele : m.tume).push(t.value); joonistaAdmin();
  } else return;
  salvestaMustand();
}
function initAdmin() {
  // Admin vahekaart on peidus: nähtav ainult sisse loginud telefonis või lingiga …/LakiLakid/#admin
  if (admin || location.hash === '#admin') $('adminNupp').style.display = '';
  if (location.hash === '#admin') setTimeout(() => vaade('admin'), 0);
  // Peidetud sissepääs (nt iPhone'i avakuva äpis, kus #admin linki ei saa avada): puuduta logo 5 korda
  let kopp = 0, koppAeg = 0;
  $('logo').addEventListener('click', () => {
    const nyyd = Date.now(); kopp = nyyd - koppAeg < 800 ? kopp + 1 : 1; koppAeg = nyyd;
    if (kopp >= 5) { kopp = 0; $('adminNupp').style.display = ''; vaade('admin'); }
  });
  window.addEventListener('hashchange', () => { if (location.hash === '#admin') { $('adminNupp').style.display = ''; vaade('admin'); } });
  $('kuu').addEventListener('click', e => {
    const r = e.target.closest('[data-n]'); if (!r) return;
    if (D.profiil[r.dataset.n]) avaProfiil(r.dataset.n); else toast('Profiil on TOP 25 mängijal');
  });
  $('ajalugu').addEventListener('click', e => {
    const r = e.target.closest('tr[data-n]'); if (!r) return;
    if (D && D.profiil[r.dataset.n]) avaProfiil(r.dataset.n); else toast('Profiil on ainult selle aasta TOP 25 mängijatel');
  });
  $('kalender').addEventListener('click', e => {
    const b = e.target.closest('#kalSeg button'); if (!b) return;
    kalTab = b.dataset.t; joonistaKalender();
  });
  $('kpi').addEventListener('click', e => { if (e.target.closest('.jarg')) vaade('kalender'); });
  $('admin').addEventListener('click', adminKlikk);
  $('admin').addEventListener('change', adminMuutus);
  $('admin').addEventListener('input', e => { if (e.target.dataset.a === 'sk') adminMuutus(e); });
  $('admin').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'uusNimi') adminKlikk({ target: document.querySelector('[data-a="lisaNimi"]') }); });
  joonistaAdmin();
}

// ---------------- START ----------------
// Laadimisekraan (põrkav pall) on näha iga avamisel vähemalt SPLASH_MS, ka siis, kui andmed on juba telefonis.
const SPLASH_MS = 2500, splashAlgus = Date.now();
let splashPeidetud = false;
function peidaSplash() {
  if (splashPeidetud) return; splashPeidetud = true;
  setTimeout(() => $('splash').classList.add('peida'), Math.max(0, SPLASH_MS - (Date.now() - splashAlgus)));
}
$('splash').addEventListener('click', () => { if (D) $('splash').classList.add('peida'); });
document.querySelector('nav').onclick = e => { const b = e.target.closest('button'); if (b) vaade(b.dataset.v); };
initAdmin();
// 1) Näita kohe viimati laaditud andmeid (telefoni mälust), 2) too värsked taustal.
let alustatud = false;
function naita(andmed, vaade) {
  D = andmed;
  $('uuend').innerHTML = `Uuendatud ${D.uuendatud} · viimane trenn ${kp(D.viimane)}`;
  $('logo').classList.toggle('keerleb', !!vaade);
  peidaSplash();
  if (!D.versioon || D.versioon < 4) $('uuend').innerHTML += '<br><span style="color:var(--hoiatus,#ffd966)">⚠️ Andmed on vanast koodist – käivita Sheetsis 📊 Uuenda statistika</span>';
  joonistaKpi();
  if (!alustatud) { alustatud = true; init(); return; }
  const n = $('mangija').value;
  const nimed = Object.keys(D.profiil).sort((a, b) => D.profiil[a].k - D.profiil[b].k);
  $('mangija').innerHTML = nimed.map(x => `<option value="${esc(x)}">${D.profiil[x].k}. ${esc(x)}</option>`).join('');
  joonistaTabel();
  joonistaKuu();
  joonistaProfiil(D.profiil[n] ? n : nimed[0]);
  if (D.profiil[n]) $('mangija').value = n;
}
let vana = null;
try { vana = JSON.parse(localStorage.getItem('korvpall')); } catch (e) { }
if (vana) naita(vana, true);
laeKalender();
fetch(ANDMED_URL, { cache: 'no-store' })
  .then(r => r.json())
  .then(uus => {
    if (!uus) throw new Error('tühi');
    try { localStorage.setItem('korvpall', JSON.stringify(uus)); } catch (e) { }
    naita(uus, false);
  })
  .catch(() => {
    $('logo').classList.remove('keerleb');
    if (vana) { $('uuend').innerHTML = `Uuendatud ${D.uuendatud} · <span class="halb">võrguühendus puudub</span>`; }
    else $('splashTekst').innerHTML = '<span class="halb">Andmeid ei saanud laadida.</span><br>Kontrolli internetti või ANDMED_URL aadressi.';
  });
</script>
